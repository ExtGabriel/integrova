<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Documentos - INTEGROVA</title>
    <link rel="icon" href="../assets/LOGO INTEGROVA.png?v=2" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .visor-header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
            z-index: 100;
        }

        .visor-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-back {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.2);
        }

        .document-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0e0e0;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .visor-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            background: #0d6efd;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #0b5ed7;
        }

        .btn-action.btn-success {
            background: #198754;
        }

        .btn-action.btn-success:hover {
            background: #157347;
        }

        .save-status {
            font-size: 0.8rem;
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .save-status.saved {
            color: #198754;
        }

        .save-status.saving {
            color: #ffc107;
        }

        /* Main container */
        .visor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Toolbar lateral */
        .toolbar {
            width: 60px;
            background: #16213e;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border-right: 1px solid #0f3460;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            color: #a0a0a0;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
            position: relative;
        }

        .tool-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .tool-btn.active {
            background: #0d6efd;
            color: #fff;
        }

        .tool-btn[title]:hover::after {
            content: attr(title);
            position: absolute;
            left: 55px;
            background: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            z-index: 1000;
        }

        .toolbar-divider {
            width: 80%;
            height: 1px;
            background: #0f3460;
            margin: 8px 0;
        }

        /* Color picker */
        .color-picker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border: 2px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #fff;
        }

        /* Stroke width */
        .stroke-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin-top: 5px;
        }

        .stroke-btn {
            width: 30px;
            height: 20px;
            background: transparent;
            border: 1px solid #444;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stroke-btn.active {
            border-color: #0d6efd;
            background: rgba(13, 110, 253, 0.2);
        }

        .stroke-line {
            background: #fff;
            border-radius: 2px;
        }

        /* PDF Viewer area */
        .pdf-viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #2d2d44;
            overflow: hidden;
        }

        /* Navigation bar */
        .nav-bar {
            background: #16213e;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border-bottom: 1px solid #0f3460;
        }

        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            color: #e0e0e0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-input {
            width: 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            text-align: center;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 20px;
        }

        .zoom-level {
            color: #e0e0e0;
            font-size: 0.85rem;
            min-width: 50px;
            text-align: center;
        }

        /* PDF canvas container */
        .pdf-canvas-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 20px;
            background: #1a1a2e;
        }

        .page-wrapper {
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            background: #fff;
        }

        #pdfCanvas {
            display: block;
        }

        #annotationCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #0f3460;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification.success {
            background: #198754;
        }

        .notification.error {
            background: #dc3545;
        }

        .notification.info {
            background: #0d6efd;
        }

        /* Cursor styles for tools */
        .cursor-pen { cursor: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23000" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>') 0 24, crosshair; }
        .cursor-highlighter { cursor: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><rect fill="%23ffeb3b" opacity="0.7" x="4" y="8" width="16" height="8"/></svg>') 12 12, crosshair; }
        .cursor-eraser { cursor: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><rect fill="%23fff" stroke="%23000" x="6" y="6" width="12" height="12" rx="2"/></svg>') 12 12, crosshair; }

        /* Text input for text tool */
        .text-input-overlay {
            position: absolute;
            display: none;
        }

        .text-input-overlay.active {
            display: block;
        }

        .text-input-overlay input {
            background: rgba(255,255,255,0.95);
            border: 2px solid #0d6efd;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 4px;
            min-width: 150px;
            outline: none;
        }
    </style>
</head>

<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando documento...</div>
    </div>

    <!-- Header -->
    <header class="visor-header">
        <div class="visor-header-left">
            <button class="btn-back" onclick="goBack()">
                <i class="bi bi-arrow-left"></i>
                Volver
            </button>
            <span class="document-title" id="documentTitle">Documento</span>
        </div>
        <div class="visor-header-right">
            <span class="save-status" id="saveStatus">
                <i class="bi bi-cloud-check"></i>
                Guardado
            </span>
            <button class="btn-action" onclick="undoAnnotation()" title="Deshacer">
                <i class="bi bi-arrow-counterclockwise"></i>
            </button>
            <button class="btn-action" onclick="redoAnnotation()" title="Rehacer">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button class="btn-action" onclick="clearAllAnnotations()" title="Limpiar todo">
                <i class="bi bi-trash"></i>
            </button>
            <button class="btn-action btn-success" onclick="exportPDF()">
                <i class="bi bi-download"></i>
                Exportar PDF
            </button>
        </div>
    </header>

    <!-- Main container -->
    <div class="visor-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <button class="tool-btn" id="toolSelect" title="Seleccionar" onclick="setTool('select')">
                <i class="bi bi-cursor"></i>
            </button>
            <button class="tool-btn active" id="toolPen" title="Pluma" onclick="setTool('pen')">
                <i class="bi bi-pencil"></i>
            </button>
            <button class="tool-btn" id="toolHighlighter" title="Resaltador" onclick="setTool('highlighter')">
                <i class="bi bi-highlighter"></i>
            </button>
            <button class="tool-btn" id="toolUnderline" title="Subrayar" onclick="setTool('underline')">
                <i class="bi bi-type-underline"></i>
            </button>
            
            <div class="toolbar-divider"></div>
            
            <button class="tool-btn" id="toolCircle" title="Círculo" onclick="setTool('circle')">
                <i class="bi bi-circle"></i>
            </button>
            <button class="tool-btn" id="toolRectangle" title="Rectángulo" onclick="setTool('rectangle')">
                <i class="bi bi-square"></i>
            </button>
            <button class="tool-btn" id="toolArrow" title="Flecha" onclick="setTool('arrow')">
                <i class="bi bi-arrow-up-right"></i>
            </button>
            <button class="tool-btn" id="toolText" title="Texto" onclick="setTool('text')">
                <i class="bi bi-fonts"></i>
            </button>
            
            <div class="toolbar-divider"></div>
            
            <button class="tool-btn" id="toolEraser" title="Borrador" onclick="setTool('eraser')">
                <i class="bi bi-eraser"></i>
            </button>
            
            <div class="toolbar-divider"></div>
            
            <!-- Colors -->
            <div class="color-picker-container">
                <button class="color-btn active" style="background: #ff0000;" data-color="#ff0000" onclick="setColor('#ff0000')"></button>
                <button class="color-btn" style="background: #0d6efd;" data-color="#0d6efd" onclick="setColor('#0d6efd')"></button>
                <button class="color-btn" style="background: #198754;" data-color="#198754" onclick="setColor('#198754')"></button>
                <button class="color-btn" style="background: #ffc107;" data-color="#ffc107" onclick="setColor('#ffc107')"></button>
                <button class="color-btn" style="background: #000000;" data-color="#000000" onclick="setColor('#000000')"></button>
            </div>
            
            <!-- Stroke width -->
            <div class="stroke-selector">
                <button class="stroke-btn" data-width="2" onclick="setStrokeWidth(2)">
                    <div class="stroke-line" style="width: 20px; height: 2px;"></div>
                </button>
                <button class="stroke-btn active" data-width="4" onclick="setStrokeWidth(4)">
                    <div class="stroke-line" style="width: 20px; height: 4px;"></div>
                </button>
                <button class="stroke-btn" data-width="8" onclick="setStrokeWidth(8)">
                    <div class="stroke-line" style="width: 20px; height: 8px;"></div>
                </button>
            </div>
        </div>

        <!-- PDF Viewer -->
        <div class="pdf-viewer-area">
            <!-- Navigation -->
            <div class="nav-bar">
                <button class="nav-btn" id="prevPage" onclick="prevPage()" disabled>
                    <i class="bi bi-chevron-left"></i>
                </button>
                <div class="page-info">
                    <span>Página</span>
                    <input type="number" class="page-input" id="pageInput" value="1" min="1" onchange="goToPage(this.value)">
                    <span>de <span id="totalPages">1</span></span>
                </div>
                <button class="nav-btn" id="nextPage" onclick="nextPage()">
                    <i class="bi bi-chevron-right"></i>
                </button>
                
                <div class="zoom-controls">
                    <button class="nav-btn" onclick="zoomOut()">
                        <i class="bi bi-zoom-out"></i>
                    </button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="nav-btn" onclick="zoomIn()">
                        <i class="bi bi-zoom-in"></i>
                    </button>
                    <button class="nav-btn" onclick="fitToWidth()" title="Ajustar al ancho">
                        <i class="bi bi-arrows-expand"></i>
                    </button>
                </div>
            </div>

            <!-- Canvas container -->
            <div class="pdf-canvas-container" id="canvasContainer">
                <div class="page-wrapper" id="pageWrapper">
                    <canvas id="pdfCanvas"></canvas>
                    <canvas id="annotationCanvas"></canvas>
                    <div class="text-input-overlay" id="textInputOverlay">
                        <input type="text" id="textInput" placeholder="Escribir texto..." onkeydown="handleTextInput(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config-supabase.js"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api-client.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/visor-pdf.js"></script>
</body>

</html>
